name: CI

# Tests, builds and (on main, only when everything passes) triggers the Render deploy hook.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HDEWS_REQUIRE_ML: "1"   # the ML harness must load in CI; a broken install fails instead of skipping
      HDEWS_DOTENV: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-ml.txt
      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: |
          python -m pip install ruff==0.16.9
          ruff check --select E9,F,B --ignore B008,B905,B904 backend ml scripts e2e
      - name: Tests
        working-directory: backend
        run: python -m pytest -rs

  frontend:
    name: Frontend build matches committed dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: frontend/dist must be the compiled output of frontend/src
        run: git diff --exit-code -- frontend/dist

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hdews:ci .
      - name: Refuses to start without a strong demo password
        run: |
          set +e
          docker run --rm hdews:ci; code=$?
          set -e
          test "$code" -ne 0
      - name: Starts, serves, runs unprivileged, keeps data across restarts
        env:
          PW: ci-only-demo-password-123
        run: |
          set -eu
          docker volume create hdews-ci-data
          start() { docker run -d --name hdews-ci -p 8000:8000 -v hdews-ci-data:/data -e HDEWS_DEMO_PASSWORD="$PW" hdews:ci; }
          wait_ok() { for i in $(seq 1 60); do curl -fsS localhost:8000/api/health && return 0; sleep 2; done; docker logs hdews-ci; return 1; }
          login() { curl -fsS -X POST localhost:8000/api/auth/login -H 'content-type: application/json' \
                      -d "{\"username\":\"reviewer\",\"password\":\"$PW\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])'; }
          events() { curl -fsS localhost:8000/api/audit-log/verify -H "authorization: Bearer $1" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["valid"];print(d["events_checked"])'; }
          start; wait_ok
          curl -fsS localhost:8000/ | grep -q '<div id="app">'
          uid=$(docker exec hdews-ci awk '/^Uid:/{print $2}' /proc/1/status)
          echo "server process uid: $uid"; test "$uid" = "10001"
          first=$(events "$(login)")
          if docker logs hdews-ci 2>&1 | grep -qF "$PW"; then echo "password leaked to logs"; exit 1; fi
          docker rm -f hdews-ci
          start; wait_ok
          second=$(events "$(login)")
          echo "audit events: first run $first, after restart $second"
          test "$second" -gt "$first"
          docker rm -f hdews-ci

  e2e:
    name: Browser end-to-end (scenarios A–G)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -r backend/requirements.txt
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Run
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          HDEWS_DOTENV: "0"
        run: python e2e/run_e2e.py --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/results.json
            ${{ runner.temp }}/shots

  deploy:
    name: Deploy to Render (main only, after all checks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy."; exit 0; fi
          curl -fsS --max-time 30 "$HOOK" > /dev/null   # Render deploy hooks are triggered with a GET request
          echo "Deploy triggered."
      - name: Wait for the new version to be healthy
        env:
          URL: ${{ vars.HDEWS_PUBLIC_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then echo "HDEWS_PUBLIC_URL variable not set; skipping post-deploy check."; exit 0; fi
          healthy=0
          for i in $(seq 1 60); do
            v=$(curl -fsS --max-time 10 "$URL/api/health" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("version") or "")') && healthy=1 || healthy=0
            if [ "$healthy" = 1 ] && [ "$v" = "$SHA" ]; then echo "Live and serving $SHA"; exit 0; fi
            sleep 10
          done
          if [ "$healthy" = 1 ] && [ -z "$v" ]; then
            echo "::warning::Service is healthy but does not report its commit (set HDEWS_VERSION or check RENDER_GIT_COMMIT); release not confirmed."
            exit 0
          fi
          echo "The deployed service did not become healthy on version $SHA within 10 minutes"; exit 1
